name: Deploy to Mac mini

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      # The runner's LaunchAgent session can't unlock the macOS login
      # keychain, so Docker Desktop's keychain-backed credential store
      # can't be used here. Point at a config with no credsStore — fine
      # since this project only pulls public images.
      DOCKER_CONFIG: /Users/yusufpc/actions-runner/.docker-config
    steps:
      - name: Pull latest code
        working-directory: /Users/yusufpc/Desktop/Projeler/SahaTakvim
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Rebuild and restart web
        working-directory: /Users/yusufpc/Desktop/Projeler/SahaTakvim
        run: docker compose up -d --no-deps --build web

      - name: Ensure nginx and certbot are running
        working-directory: /Users/yusufpc/Desktop/Projeler/SahaTakvim
        run: docker compose up -d nginx certbot
