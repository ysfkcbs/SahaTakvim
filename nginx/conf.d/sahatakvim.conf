limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

server {
    listen 80;
    server_name merkezsaha.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name merkezsaha.com;

    ssl_certificate     /etc/letsencrypt/live/merkezsaha.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merkezsaha.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    location = /auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Turnuva (school tournament platform) — separate app, separate
    # Docker Compose stack, reached via the host since it isn't on this
    # stack's network. Trailing slash on both the location and proxy_pass
    # strips the /turnuva prefix before forwarding; X-Forwarded-Prefix
    # lets Flask's ProxyFix(x_prefix=1) regenerate url_for() links
    # correctly prefixed with /turnuva.
    location = /turnuva {
        return 301 /turnuva/;
    }

    location /turnuva/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://host.docker.internal:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /turnuva;
    }

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
